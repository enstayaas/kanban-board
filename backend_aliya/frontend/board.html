<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Канбан-доска</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</head>
<body>

<div class="nav">
    <a href="index.html" id="nav-projects" class="back-btn"><i class="fa-solid fa-arrow-left"></i> К проектам</a>
    <a href="#" onclick="goToCurrentBoard(event)" id="nav-board"><i class="fa-regular fa-rectangle-list"></i> Доска</a>
    <a href="users.html"><i class="fa-solid fa-users"></i> Пользователи</a>
    <a href="profile.html"><i class="fa-regular fa-user"></i> Профиль</a>
    <a href="archive.html"><i class="fa-solid fa-box-archive"></i> Архив</a>
    <a href="stats.html"><i class="fa-solid fa-chart-simple"></i> Статистика</a>
    <a href="activity.html"><i class="fa-solid fa-clock"></i> Активность</a>
    <a href="settings.html"><i class="fa-solid fa-gear"></i> Настройки</a>
    <button onclick="logout()" class="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Выйти</button>
    <button id="themeToggle" class="theme-btn" style="margin-left: auto;"><i class="fa-solid fa-moon"></i> Тёмная тема</button>
</div>

<h1>Канбан-доска</h1>

<div class="filters">
    <button onclick="openCreateModal()"><i class="fa-solid fa-plus"></i> Создать задачу</button>
    <select id="priorityFilter">
        <option value="">Все приоритеты</option>
        <option value="high">🔴 Высокий</option>
        <option value="medium">🟡 Средний</option>
        <option value="low">🟢 Низкий</option>
    </select>
   <input id="userFilter" placeholder="👤 Имя исполнителя" type="text" />
    <input type="text" id="searchInput" placeholder="🔍 Поиск по названию задачи" />
    <button onclick="applyFilter()"><i class="fa-solid fa-magnifying-glass"></i> Применить</button>
    <button onclick="clearFilters()"><i class="fa-solid fa-trash-can"></i> Очистить</button>
    <button onclick="openInviteModal()"><i class="fa-solid fa-envelope"></i> Пригласить</button>
</div>

<div class="labels-panel">
    <h3><i class="fa-solid fa-tags"></i> Метки</h3>
    <div id="labelsList" class="labels-list">Загрузка...</div>
    <div class="add-label-form">
        <input type="text" id="newLabelName" placeholder="Название метки" maxlength="60">
        <input type="color" id="newLabelColor" value="#3b82f6">
        <button onclick="createLabel()"><i class="fa-solid fa-plus"></i> Добавить</button>
    </div>
    <div class="filter-by-labels">
        <h4>Фильтр по меткам:</h4>
        <div id="labelFilters" class="label-filters"></div>
        <button onclick="clearLabelFilter()"><i class="fa-solid fa-eraser"></i> Очистить</button>
    </div>
</div>

<div class="sort-pagination-panel">
    <div class="sort-section">
        <label>📊 Сортировать по:</label>
        <select id="sortBy">
            <option value="priority">Приоритету</option>
            <option value="title">Названию</option>
            <option value="assigned_to">Исполнителю</option>
        </select>
        <select id="sortOrder">
            <option value="desc">По убыванию</option>
            <option value="asc">По возрастанию</option>
        </select>
        <button onclick="applySortAndPage()">🔄 Применить</button>
    </div>
    <div class="pagination-section">
        <button onclick="prevPage()" id="prevBtn" disabled>◀ Назад</button>
        <span id="pageInfo">Страница 1 из 1</span>
        <button onclick="nextPage()" id="nextBtn" disabled>Вперед ▶</button>
        <div class="per-page">
            <label>Показывать:</label>
            <select id="perPage" onchange="changePerPage()">
                <option value="5">5</option>
                <option value="10" selected>10</option>
                <option value="20">20</option>
                <option value="50">50</option>
            </select>
            <span>задач</span>
        </div>
    </div>
    <button onclick="openCreateColumnModal()" class="btn-primary">
        <i class="fa-solid fa-plus"></i> Добавить колонку
    </button>
</div>

<div class="board-container" id="columnsContainer"></div>

<div id="modal" class="modal">
    <div class="modal-content">
        <h3>Редактировать задачу</h3>
        <input id="editTitle" placeholder="Название">
        <textarea id="editDesc" placeholder="Описание" rows="3"></textarea>
        <select id="editPriority">
            <option value="low">🟢 Низкий</option>
            <option value="medium">🟡 Средний</option>
            <option value="high">🔴 Высокий</option>
        </select>
        <select id="editAssignedTo">
            <option value="">Не назначен</option>
            <option value="1">Анна Смирнова</option>
            <option value="2">Борис Петров</option>
            <option value="3">Виктор Сидоров</option>
            <option value="4">Дарья Кузнецова</option>
            <option value="5">Елена Морозова</option>
            <option value="6">Максим Иванов</option>
            <option value="7">Ольга Соколова</option>
            <option value="8">Игорь Васильев</option>
        </select>
        <div class="modal-labels-section">
            <h4>🏷️ Метки задачи:</h4>
            <div id="modalTaskLabels" class="modal-labels-list"></div>
        </div>

        <div class="comments-section" style="margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px;">
            <h4 style="margin-bottom: 10px; color: #fff;"><i class="fa-regular fa-comments"></i> Комментарии</h4>
            <div id="taskCommentsList" style="max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; padding-right: 5px;"></div>
            <div class="comment-form" style="display: flex; gap: 8px;">
                <input type="text" id="newCommentInput" placeholder="Напишите комментарий... (Enter для отправки)" 
                       style="flex-grow: 1; padding: 8px 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: #fff; font-size: 13px; outline: none;">
                <button onclick="submitNewComment()" 
                        style="background: #9333ea; color: white; border: none; padding: 0 14px; border-radius: 6px; font-weight: 500; cursor: pointer;">
                    Отправить
                </button>
            </div>
        </div>
        <div class="modal-buttons" style="margin-top: 20px;">
            <button onclick="saveTask()">Сохранить</button>
            <button onclick="archiveCurrentTask()">В архив</button>
            <button onclick="closeModal()">Отмена</button>
        </div>
    </div>
</div>

<div id="createModal" class="modal">
    <div class="modal-content">
        <h3>Новая задача</h3>
        <input id="createTitle" placeholder="Название">
        <textarea id="createDesc" placeholder="Описание" rows="3"></textarea>
        <select id="createPriority">
            <option value="low">🟢 Низкий</option>
            <option value="medium" selected>🟡 Средний</option>
            <option value="high">🔴 Высокий</option>
        </select>
        <input id="createAssignedTo" placeholder="ID исполнителя" type="number">
        <select id="createColumnId">
            <option value="1">📋 To Do</option>
            <option value="2">⚙️ In Progress</option>
            <option value="3">✅ Done</option>
        </select>
        <div class="modal-buttons">
            <button onclick="createTask()">Создать</button>
            <button onclick="closeCreateModal()">Отмена</button>
        </div>
    </div>
</div>

<div id="inviteModal" class="modal">
    <div class="modal-content">
        <h3><i class="fa-solid fa-envelope"></i> Пригласить участника</h3>
        <input type="email" id="inviteEmail" placeholder="Email пользователя">
        <select id="inviteRole">
            <option value="member">Участник</option>
            <option value="owner">Владелец</option>
        </select>
        <div class="modal-buttons">
            <button onclick="sendInvite()">Отправить</button>
            <button onclick="closeInviteModal()">Отмена</button>
        </div>
        <div id="inviteMessage"></div>
    </div>
</div>

<div id="createColumnModal" class="modal">
    <div class="modal-content">
        <h3><i class="fa-solid fa-folder-plus"></i> Добавить новую колонку</h3>
        <input type="text" id="colTitle" placeholder="Введите название колонки (например: Тестирование)">
        <div class="modal-buttons" style="margin-top: 15px;">
            <button onclick="createColumn()">Создать</button>
            <button onclick="closeCreateColumnModal()">Отмена</button>
        </div>
    </div>
</div>

<script>
    const API_BASE_URL = 'http://localhost:8081';
    let currentTask = null;
    let allTasks = [];
    let currentPage = 1;
    let perPage = 10;
    let currentSortBy = 'priority';
    let currentSortOrder = 'desc';
    let searchQuery = '';
    let selectedLabelFilters = [];
    let labels = [];
    
    const urlParams = new URLSearchParams(window.location.search);
    let currentBoardId = urlParams.get('id') || localStorage.getItem('currentBoardId') || 1;

    // 🔥 ДОБАВЛЕНО: Функции управления модалкой колонки
    function openCreateColumnModal() {
        const modal = document.getElementById('createColumnModal');
        if (modal) modal.style.display = 'flex';
    }

    function closeCreateColumnModal() {
        const modal = document.getElementById('createColumnModal');
        const input = document.getElementById('colTitle');
        if (modal) modal.style.display = 'none';
        if (input) input.value = '';
    }

    // ========== ОТПРАВКА НОВОЙ КОЛОНКИ В БД ==========
async function createColumn() {
    const titleInput = document.getElementById('colTitle');
    const title = titleInput ? titleInput.value.trim() : '';

    if (!title) {
        alert('❌ Введите название колонки');
        return;
    }

    const token = localStorage.getItem('token');

    try {
        const response = await fetch(`${API_BASE_URL}/columns`, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                board_id: parseInt(currentBoardId),
                title: title
            })
        });

        if (!response.ok) {
            const errData = await response.json().catch(() => ({}));
            throw new Error(errData.error || 'Ошибка сервера');
        }

        closeCreateColumnModal();
        
        // 🔥 Жестко перезагружаем страницу, чтобы фронтенд перерисовал доску с новыми данными
        window.location.reload(); 

    } catch (error) {
        console.error('Ошибка добавления колонки:', error);
        alert(`Не удалось создать колонку: ${error.message}`);
    }
}
    // ЗАГРУЗКА МЕТОК
    async function loadLabels() {
        const token = localStorage.getItem('token');
        if (!token) return;
        try {
            const response = await fetch(`${API_BASE_URL}/labels?board_id=${currentBoardId}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (response.ok) {
                const data = await response.json();
                labels = data;
                window.labels = data;
                renderLabelsList();
                renderLabelFilters();
            }
        } catch (error) {
            console.error('Failed to load labels:', error);
        }
    }

    function renderLabelsList() {
        const container = document.getElementById('labelsList');
        if (!container) return;
        if (!labels || labels.length === 0) {
            container.innerHTML = '<div>Нет меток. Создайте первую!</div>';
            return;
        }
        container.innerHTML = labels.map(label => `
            <div class="label" style="background: ${label.color};">${escapeHtml(label.name)}<span class="remove-label" onclick="deleteLabel(${label.id})">✖</span></div>
        `).join('');
    }

    function renderLabelFilters() {
        const container = document.getElementById('labelFilters');
        if (!container) return;
        if (!labels || labels.length === 0) {
            container.innerHTML = '<div>Создайте метки для фильтрации</div>';
            return;
        }
        container.innerHTML = labels.map(label => `
            <div class="label-filter ${selectedLabelFilters.includes(label.id) ? 'active' : ''}" style="background:${label.color};" onclick="toggleLabelFilter(${label.id})">${escapeHtml(label.name)}</div>
        `).join('');
    }

    function toggleLabelFilter(labelId) {
        if (selectedLabelFilters.includes(labelId)) {
            selectedLabelFilters = selectedLabelFilters.filter(id => id !== labelId);
        } else {
            selectedLabelFilters.push(labelId);
        }
        renderLabelFilters();
        loadTasks();
    }

    function clearLabelFilter() {
        selectedLabelFilters = [];
        renderLabelFilters();
        loadTasks();
    }

    async function createLabel() {
        const name = document.getElementById('newLabelName').value.trim();
        const color = document.getElementById('newLabelColor').value;
        if (!name) return;
        const token = localStorage.getItem('token');
        try {
            await fetch(`${API_BASE_URL}/labels`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ name, color, board_id: parseInt(currentBoardId) })
            });
            document.getElementById('newLabelName').value = '';
            loadLabels();
        } catch (error) {
            console.error(error);
        }
    }

    async function deleteLabel(labelId) {
        const token = localStorage.getItem('token');
        try {
            await fetch(`${API_BASE_URL}/labels/${labelId}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            loadLabels();
        } catch (error) {
            console.error(error);
        }
    }

    // ЗАГРУЗКА ЗАДАЧ И КОЛОНОК
   async function loadTasks() {
    if (window.isLoadingTasks) return; // Защита от дублирования запросов
    window.isLoadingTasks = true;

    const boardDiv = document.getElementById('columnsContainer') || document.getElementById('board');
    if (boardDiv) {
        boardDiv.innerHTML = '<div style="text-align:center; padding:40px; color:#fff;">Загрузка доски...</div>';
    }

    try {
        // 1. Сначала скачиваем кастомные колонки для текущей доски из БД
        let allColumns = [];
        const token = localStorage.getItem('token');
        
        try {
            const resCols = await fetch(`${API_BASE_URL}/columns?board_id=${currentBoardId}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (resCols.ok) {
                allColumns = await resCols.json();
            }
        } catch (colError) {
            console.error('Ошибка при загрузке колонок:', colError);
        }

        // Делаем список колонок доступным глобально, чтобы функция renderBoard видела их
        window.allColumns = Array.isArray(allColumns) ? allColumns : [];

        // 2. Формируем список ВСЕХ колонок, для которых надо стянуть задачи:
        // Системные [1, 2, 3] + ID новых созданных колонок
        const systemIds = [1, 2, 3];
        const customIds = window.allColumns.map(c => parseInt(c.id)).filter(id => !systemIds.includes(id));
        const totalColumnsToFetch = [...systemIds, ...customIds];

        let loadedTasks = [];

        // 3. Собираем задачи по абсолютно ВСЕМ активным колонкам
        for (const columnId of totalColumnsToFetch) {
            try {
                const response = await fetch(`${API_BASE_URL}/tasks?board_id=${currentBoardId}&column_id=${columnId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    const data = await response.json();
                    // Проверяем структуру ответа (массив или объект с .data)
                    if (data && data.data) {
                        loadedTasks.push(...data.data);
                    } else if (Array.isArray(data)) {
                        loadedTasks.push(...data);
                    }
                }
            } catch (taskErr) {
                console.error(`Ошибка загрузки задач для колонки ${columnId}:`, taskErr);
            }
        }

        allTasks = loadedTasks;

        // 4. Отрисовываем доску
        if (typeof renderBoard === 'function') {
            await renderBoard(allTasks);
        } else {
            console.error("Функция renderBoard не найдена!");
        }

    } catch (error) {
        console.error('Общая ошибка loadTasks:', error);
        if (boardDiv) {
            boardDiv.innerHTML = '<div class="empty-state">⚠️ Не удалось загрузить данные доски</div>';
        }
    } finally {
        window.isLoadingTasks = false;
    }
}
    // ОТРИСОВКА ДОСКИ С ДРАГ-ЭНД-ДРОПОМ
    function renderBoard(tasks) {
        const container = document.getElementById('columnsContainer');
        if (!container) return;
        container.innerHTML = '';
        
        const columns = [1, 2, 3];
        const titles = {
            1: '<i class="fa-regular fa-rectangle-list"></i> To Do',
            2: '<i class="fa-solid fa-gear"></i> In Progress',
            3: '<i class="fa-regular fa-circle-check"></i> Done'
        };
        const priorityEmojis = { high: '🔴', medium: '🟡', low: '🟢' };
        
        columns.forEach(col => {
            const colDiv = document.createElement('div');
            colDiv.className = 'column';
            colDiv.innerHTML = `<h3>${titles[col]}</h3>`;
            
            const taskListDiv = document.createElement('div');
            taskListDiv.className = 'task-list';
            taskListDiv.dataset.columnId = col;
            taskListDiv.style.minHeight = '150px'; 
            
            const tasksInColumn = tasks.filter(t => t.column_id === col);
            
            tasksInColumn.forEach(task => {
                const taskDiv = document.createElement('div');
                taskDiv.className = 'task-card';
                taskDiv.dataset.taskId = task.id;
                taskDiv.style.cursor = 'grab';
                taskDiv.innerHTML = `
                    <div>${priorityEmojis[task.priority] || '⚪'} <strong>${escapeHtml(task.title)}</strong></div>
                    <div style="font-size:10px; color:#888; margin-top:5px;"><i class="fa-regular fa-user"></i> ${getUserName(task.assigned_to)}</div>
                `;
                
                taskDiv.onclick = () => {
                    if (taskDiv.classList.contains('sortable-chosen')) return;
                    openModal(task);
                };
                
                taskListDiv.appendChild(taskDiv);
            });
            
            colDiv.appendChild(taskListDiv);
            container.appendChild(colDiv);
            
            if (typeof Sortable !== 'undefined') {
                new Sortable(taskListDiv, {
                    group: 'kanban-board',
                    animation: 200,
                    ghostClass: 'sortable-ghost',
                    chosenClass: 'sortable-chosen',
                    onEnd: async (evt) => {
                        const taskId = evt.item.dataset.taskId;
                        const newColumnId = evt.to.dataset.columnId;
                        if (taskId && newColumnId && evt.from !== evt.to) {
                            await updateTaskPosition(taskId, newColumnId);
                        }
                    }
                });
            }
        });
    }

    async function updateTaskPosition(taskId, newColumnId) {
        const token = localStorage.getItem('token');
        const localTask = allTasks.find(t => t.id == taskId);
        if (!localTask) return;

        try {
            const response = await fetch(`${API_BASE_URL}/tasks/${taskId}`, {
                method: 'PUT',
                headers: { 
                    'Authorization': `Bearer ${token}`, 
                    'Content-Type': 'application/json' 
                },
                body: JSON.stringify({
                    title: localTask.title,
                    description: localTask.description || '',
                    priority: localTask.priority || 'medium',
                    assigned_to: localTask.assigned_to ? parseInt(localTask.assigned_to) : 0,
                    column_id: parseInt(newColumnId), 
                    board_id: parseInt(currentBoardId) 
                })
            });

            if (response.ok) {
                const columnNames = { 1: 'To Do', 2: 'In Progress', 3: 'Done' };
                saveActivityLog('move_task', `Переместила задачу "${localTask.title}" в колонку "${columnNames[newColumnId] || newColumnId}"`);
                localTask.column_id = parseInt(newColumnId);
            } else {
                await loadTasks();
            }
        } catch (error) {
            console.error(error);
            await loadTasks();
        }
    }

    function applyFilter() { currentPage = 1; applySortAndPage(); }
    
    function clearFilters() {
        document.getElementById('priorityFilter').value = '';
        document.getElementById('userFilter').value = '';
        document.getElementById('searchInput').value = '';
        searchQuery = '';
        currentPage = 1;
        loadTasks();
    }

    function sortTasks(tasks) {
        const sortBy = document.getElementById('sortBy')?.value || currentSortBy;
        const sortOrder = document.getElementById('sortOrder')?.value || currentSortOrder;
        currentSortBy = sortBy; currentSortOrder = sortOrder;
        return [...tasks].sort((a, b) => {
            if (sortBy === 'priority') {
                const w = {high:3,medium:2,low:1};
                return sortOrder === 'asc' ? (w[a.priority]||0) - (w[b.priority]||0) : (w[b.priority]||0) - (w[a.priority]||0);
            }
            if (sortBy === 'title') return sortOrder === 'asc' ? (a.title||'').localeCompare(b.title||'') : (b.title||'').localeCompare(a.title||'');
            return 0;
        });
    }

    function paginateTasks(tasks) { return tasks.slice((currentPage-1)*perPage, currentPage*perPage); }
    
    function updatePaginationButtons(total) { 
        const pages = Math.ceil(total/perPage); 
        document.getElementById('prevBtn').disabled = currentPage<=1; 
        document.getElementById('nextBtn').disabled = currentPage>=pages; 
        document.getElementById('pageInfo').innerText = `Страница ${currentPage} из ${pages||1}`; 
    }
    
    function prevPage() { if(currentPage>1){currentPage--;applySortAndPage();} }
    function nextPage() { if(currentPage<Math.ceil(allTasks.length/perPage)){currentPage++;applySortAndPage();} }
    function changePerPage() { perPage = parseInt(document.getElementById('perPage')?.value||10); currentPage=1; applySortAndPage(); }

    function applySortAndPage() {
        let filtered = [...allTasks];
        const priority = document.getElementById('priorityFilter')?.value;
        const userId = document.getElementById('userFilter')?.value;
        if(priority) filtered = filtered.filter(t=>t.priority===priority);
        if(userId) filtered = filtered.filter(t=>t.assigned_to===parseInt(userId));
        if(searchQuery) filtered = filtered.filter(t=>t.title?.toLowerCase().includes(searchQuery.toLowerCase()));
        const sorted = sortTasks(filtered);
        updatePaginationButtons(sorted.length);
        renderBoard(paginateTasks(sorted));
    }

    // ИНТЕГРИРОВАННАЯ ФУНКЦИЯ ОТКРЫТИЯ МОДАЛКИ С ЗАГРУЗКОЙ КОММЕНТАРИЕВ
    async function openModal(task) {
        currentTask = task;
        document.getElementById('editTitle').value = task.title || '';
        document.getElementById('editDesc').value = task.description || '';
        document.getElementById('editPriority').value = task.priority || 'medium';
        document.getElementById('editAssignedTo').value = task.assigned_to || '';
        
        // Очищаем инпут комментариев при каждом открытии новой задачи
        document.getElementById('newCommentInput').value = '';

        // Подгружаем комментарии для этой конкретной задачи
        await loadTaskComments(task.id);

        const container = document.getElementById('modalTaskLabels');
        if (container && window.labels && window.labels.length) {
            let taskLabelIds = [];
            try {
                const token = localStorage.getItem('token');
                const resp = await fetch(`${API_BASE_URL}/tasks/${task.id}/labels`, { headers: { 'Authorization': `Bearer ${token}` } });
                if (resp.ok) {
                    const taskLabels = await resp.json();
                    taskLabelIds = taskLabels.map(l => l.id);
                }
            } catch(e) { console.warn(e); }
            
            container.innerHTML = window.labels.map(label => `
                <div class="modal-label-item">
                    <label style="background:${label.color}; padding:5px 12px; border-radius:20px; margin:4px; display:inline-block; color:white; cursor:pointer;">
                        <input type="checkbox" value="${label.id}" ${taskLabelIds.includes(label.id) ? 'checked' : ''} onchange="toggleTaskLabel(${task.id}, ${label.id}, this.checked)">
                        ${label.name}
                    </label>
                </div>
            `).join('');
        }
        document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; currentTask = null; }
    
    // ЛОГИКА ФРОНТЕНДА ДЛЯ ПОЛУЧЕНИЯ КОММЕНТАРИЕВ
   async function loadTaskComments(taskId) {
    const commentsContainer = document.getElementById('taskCommentsList');
    const token = localStorage.getItem('token');
    if (!commentsContainer) return;

    commentsContainer.innerHTML = '<p style="color: #a1a1aa; font-size: 12px;">Синхронизация...</p>';

    try {
        const response = await fetch(`${API_BASE_URL}/comments?task_id=${taskId}`, {
            method: 'GET',
            headers: { 'Authorization': `Bearer ${token}` }
        });

        // Если сервер вернул ошибку, вытягиваем из него детали
        if (!response.ok) {
            let serverError = '';
            try {
                const errJson = await response.json();
                serverError = errJson.error || errJson.message || '';
            } catch(e) {
                serverError = 'Не удалось распарсить JSON ошибки';
            }
            throw new Error(`Статус: ${response.status}. Текст: ${serverError}`);
        }

        const comments = await response.json();
        
        if (!comments || comments.length === 0) {
            commentsContainer.innerHTML = '<p style="color: #a1a1aa; font-size: 12px; font-style: italic; margin: 5px 0;">Комментариев пока нет...</p>';
            return;
        }

        commentsContainer.innerHTML = comments.map(comment => {
            const timeString = new Date(comment.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            return `
                <div style="background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); padding: 8px 10px; border-radius: 6px;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 3px; font-size: 11px;">
                        <span style="font-weight: 600; color: #a78bfa;">${escapeHtml(comment.username) || 'Пользователь'}</span>
                        <span style="color: #71717a;">${timeString}</span>
                    </div>
                    <div style="color: #e4e4e7; font-size: 13px; word-break: break-word;">${escapeHtml(comment.content)}</div>
                </div>
            `;
        }).join('');

        commentsContainer.scrollTop = commentsContainer.scrollHeight;
    } catch (error) {
        console.error('Детальная ошибка загрузки:', error);
        commentsContainer.innerHTML = `<p style="color: #ef4444; font-size: 12px;">⚠️ ${error.message}</p>`;
    }
}
    // ЛОГИКА ФРОНТЕНДА ДЛЯ ДОБАВЛЕНИЯ КОММЕНТАРИЯ
    async function submitNewComment() {
        const input = document.getElementById('newCommentInput');
        const content = input?.value.trim();
        const token = localStorage.getItem('token');

        if (!content || !currentTask) return;

        try {
            // Твой Go бэкенд ждет POST /comments с task_id внутри JSON
            const response = await fetch(`${API_BASE_URL}/comments`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    task_id: parseInt(currentTask.id),
                    content: content
                })
            });

            if (!response.ok) throw new Error('Ошибка отправки');

            input.value = ''; 
            await loadTaskComments(currentTask.id); 
        } catch (error) {
            console.error(error);
            alert('Не удалось отправить комментарий');
        }
    }

    async function archiveCurrentTask() {
        if (!currentTask) { alert('Ошибка: Не выбрана задача'); return; }
        if (!confirm(`Переместить задачу "${currentTask.title}" в архив?`)) return;

        const token = localStorage.getItem('token');
        try {
            const response = await fetch(`${API_BASE_URL}/tasks/${currentTask.id}/archive`, {
                method: 'PATCH',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
            });

            if (response.ok) {
                saveActivityLog('archive_task', `Архивировала задачу "${currentTask.title}"`);
                closeModal();
                await loadTasks();
            } else {
                const errData = await response.json();
                alert(`Ошибка: ${errData.error || response.statusText}`);
            }
        } catch (error) { alert('Не удалось связаться с сервером'); }
    }

    function openCreateModal() { document.getElementById('createModal').style.display = 'flex'; }
    function closeCreateModal() { document.getElementById('createModal').style.display = 'none'; }

    async function saveTask() {
        if (!currentTask) return;
        const token = localStorage.getItem('token');
        try {
            await fetch(`${API_BASE_URL}/tasks/${currentTask.id}`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    title: document.getElementById('editTitle').value,
                    description: document.getElementById('editDesc').value,
                    priority: document.getElementById('editPriority').value,
                    assigned_to: parseInt(document.getElementById('editAssignedTo').value) || 0,
                    column_id: currentTask.column_id,
                    board_id: parseInt(currentBoardId)
                })
            });
            closeModal();
            loadTasks();
        } catch(e) { console.error(e); }
    }

    async function createTask() {
        const titleInput = document.getElementById('createTitle');
        const descriptionInput = document.getElementById('createDesc');
        const prioritySelect = document.getElementById('createPriority');
        const assignedToSelect = document.getElementById('createAssignedTo');
        const columnSelect = document.getElementById('createColumnId'); 
        const token = localStorage.getItem('token');

        if (!titleInput || !titleInput.value.trim()) {
            alert('Название задачи не может быть пустым!');
            return;
        }

        const taskData = {
            title: titleInput.value.trim(),
            description: descriptionInput ? descriptionInput.value.trim() : '',
            priority: prioritySelect ? prioritySelect.value : 'medium',
            column_id: columnSelect ? parseInt(columnSelect.value) : 1, 
            board_id: parseInt(currentBoardId), 
            assigned_to: (assignedToSelect && assignedToSelect.value) ? parseInt(assignedToSelect.value) : 0
        };

        try {
            const response = await fetch(`${API_BASE_URL}/tasks`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify(taskData)
            });

            if (response.ok) {
                titleInput.value = '';
                if (descriptionInput) descriptionInput.value = '';
                if (assignedToSelect) assignedToSelect.value = '';
                closeCreateModal();
                await loadTasks();
            }
        } catch (error) { console.error(error); }
    }

    let isToggling = false;
    async function toggleTaskLabel(taskId, labelId, isChecked) {
        if (isToggling) return;
        isToggling = true;
        const token = localStorage.getItem('token');
        try {
            if (isChecked) {
                await fetch(`${API_BASE_URL}/tasks/${taskId}/labels`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ label_id: labelId })
                });
            } else {
                await fetch(`${API_BASE_URL}/tasks/${taskId}/labels/${labelId}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
            }
            await loadTasks();
        } catch(e) { console.warn(e); }
        finally { isToggling = false; }
    }

    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]||m)); }
    
    const users = {1:"Анна Смирнова",2:"Борис Петров",3:"Виктор Сидоров",4:"Дарья Кузнецова",5:"Елена Морозова",6:"Максим Иванов",7:"Ольга Соколова",8:"Игорь Васильев"};
    function getUserName(id) { return users[id] || "Не назначен"; }

    const searchInput = document.getElementById('searchInput');
    let searchTimeout;
    if (searchInput) searchInput.addEventListener('input', (e) => { clearTimeout(searchTimeout); searchTimeout = setTimeout(() => { searchQuery = e.target.value.trim(); currentPage = 1; applySortAndPage(); }, 300); });

    function openInviteModal() { document.getElementById('inviteModal').style.display = 'flex'; }
    function closeInviteModal() { document.getElementById('inviteModal').style.display = 'none'; }

    async function sendInvite() {
        const email = document.getElementById('inviteEmail').value.trim();
        const role = document.getElementById('inviteRole').value;
        const token = localStorage.getItem('token');
        if (!email) { alert('Введите email'); return; }
        try {
            const response = await fetch(`${API_BASE_URL}/invitations`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ email, role, board_id: parseInt(currentBoardId) })
            });
            if (response.ok) {
                alert('Приглашение отправлено!');
                closeInviteModal();
                document.getElementById('inviteEmail').value = '';
            } else {
                const error = await response.json();
                alert(error.error || 'Ошибка отправки');
            }
        } catch (error) { alert('Ошибка сети: ' + error.message); }
    }

    // ТЕМЫ ОФОРМЛЕНИЯ
    const theme = localStorage.getItem('theme');
    if (theme === 'light') { document.body.classList.remove('dark'); document.body.classList.add('light'); }
    else { document.body.classList.add('dark'); document.body.classList.remove('light'); }
    document.getElementById('themeToggle')?.addEventListener('click', () => { document.body.classList.toggle('dark'); document.body.classList.toggle('light'); localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light'); });

    // СТАРТ ПРИ ЗАГРУЗКЕ СТРАНИЦЫ
    document.addEventListener('DOMContentLoaded', async () => {
        await loadLabels();
        await loadTasks();
        document.getElementById('modal')?.addEventListener('click', (e) => { if (e.target === document.getElementById('modal')) closeModal(); });
        document.getElementById('createModal')?.addEventListener('click', (e) => { if (e.target === document.getElementById('createModal')) closeCreateModal(); });
        
        // Отправка комментариев по Enter
        document.getElementById('newCommentInput')?.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                submitNewComment();
            }
        });
    });

    function saveActivityLog(action, description) {
        let logs = [];
        try {
            const localData = localStorage.getItem('mock_activities');
            if (localData) logs = JSON.parse(localData);
        } catch (e) { console.warn(e); }

        logs.unshift({
            id: Date.now(),
            action: action,
            description: description,
            user_name: 'Ты (Текущий пользователь)',
            created_at: new Date().toISOString()
        });

        localStorage.setItem('mock_activities', JSON.stringify(logs));
    }

    function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        window.location.href = 'index.html';
        
    }
</script>
