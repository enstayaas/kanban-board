<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои проекты - Kanban</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Глобальные стили и переменные под дизайн из скриншота */
        :root {
            --gradient-bg: linear-gradient(135deg, #161233 0%, #1d1844 50%, #15102a 100%);
            --nav-bg: rgba(255, 255, 255, 0.04);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-hover: rgba(255, 255, 255, 0.09);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-glow: 0 0 15px rgba(79, 70, 229, 0.6);
            --input-bg: rgba(15, 23, 42, 0.6);
            --danger-color: #ef4444;
        }

        body.light {
            --gradient-bg: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --nav-bg: #ffffff;
            --card-bg: #ffffff;
            --card-hover: #f1f5f9;
            --border-color: rgba(0, 0, 0, 0.08);
            --text-color: #0f172a;
            --text-secondary: #64748b;
            --accent-glow: 0 4px 12px rgba(79, 70, 229, 0.2);
            --input-bg: #f1f5f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--gradient-bg);
            background-attachment: fixed;
            color: var(--text-color);
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        /* --- ВЕРХНЯЯ ГОРИЗОНТАЛЬНАЯ ПАНЕЛЬ НАВИГАЦИИ --- */
        .header-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 40px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
        }

        .nav-logo i {
            color: #6366f1;
        }

        .nav-links {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-color);
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .nav-links a:hover, .nav-links a.active {
            background: rgba(255, 255, 255, 0.08);
            color: #818cf8;
        }

        body.light .nav-links a:hover, body.light .nav-links a.active {
            background: rgba(0, 0, 0, 0.05);
        }

        .nav-right-buttons {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .theme-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .theme-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-logout {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 10px 16px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.2s;
        }

        .btn-logout:hover {
            color: var(--danger-color);
        }

        /* --- ОСНОВНОЙ КОНТЕНТ С ПРОЕКТАМИ --- */
        .boards-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 60px 40px;
        }

        .boards-main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 48px;
        }

        .boards-main-header h1 {
            font-size: 32px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 16px;
            letter-spacing: -0.5px;
        }

        /* Кнопка с неоновой подсветкой */
        .create-board-btn {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--accent-glow);
            transition: all 0.2s;
        }

        .create-board-btn:hover {
            background: #4338ca;
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(79, 70, 229, 0.8);
        }

        /* Расправленная сетка проектов */
        .boards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 28px;
        }

        /* Стильные закругленные карточки */
        .board-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            
            border-radius: 16px;
            padding: 24px;

            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 190px;
            transition: all 0.25s ease;
        }

        /* Находишь этот кусок в коде и заменяешь его */
.board-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 24px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 190px;
    /* Плавный переход для всех эффектов */
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
    position: relative;
}

/* ЭФФЕКТ ВЫДЕЛЕНИЯ КАРТОЧКИ ПРИ НАВЕДЕНИИ */
.board-card:hover {
    transform: translateY(-5px) scale(1.02); /* Карточка плавно приподнимается и чуть увеличивается */
    background: var(--card-hover);
    border-color: #4f46e5; /* Рамка становится ярко-фиолетовой */
    /* Сочное неоновое свечение вокруг карточки */
    box-shadow: 0 10px 30px rgba(79, 70, 229, 0.3), 0 0 20px rgba(99, 102, 241, 0.2); 
}

/* Для светлой темы сделаем свечение помягче */
body.light .board-card:hover {
    border-color: #4f46e5;
    box-shadow: 0 10px 25px rgba(79, 70, 229, 0.15);
}
        .board-card h3 {
            font-size: 19px;
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            word-break: break-all;
        }

        .board-card h3 i {
            color: #818cf8;
        }

        .board-card p {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .board-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-secondary);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 14px;
        }

        .delete-board {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 15px;
            padding: 6px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .delete-board:hover {
            color: var(--danger-color);
            background: rgba(239, 68, 68, 0.1);
        }

        .empty-boards {
            text-align: center;
            grid-column: 1 / -1;
            padding: 60px;
            color: var(--text-secondary);
            font-size: 15px;
        }

        /* --- МОДАЛЬНЫЕ ОКНА --- */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 7, 22, 0.7);
            backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #1d1844;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        body.light .modal-content {
            background: #ffffff;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }

        .btn-save {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-cancel {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body class="dark">

<header class="header-nav">
    <div class="nav-logo">
        <i class="fa-solid fa-square-poll-vertical"></i>
        <span>Kanban Board</span>
    </div>
    
    <nav class="nav-links">
        <a href="index.html" class="active"><i class="fa-regular fa-rectangle-list"></i> Мои проекты</a>
        <a href="profile.html"><i class="fa-regular fa-user"></i> Профиль</a>
        <a href="settings.html"><i class="fa-solid fa-gear"></i> Настройки</a>
        <a href="archive.html"><i class="fa-solid fa-box-archive"></i> Архив и Корзина</a>
    </nav>

    <div class="nav-right-buttons">
        <button id="themeToggle" class="theme-btn">
            <i class="fa-solid fa-moon"></i> <span>Тёмная тема</span>
        </button>
        <button onclick="logout()" class="btn-logout">
            <i class="fa-solid fa-right-from-bracket"></i> Выход
        </button>
    </div>
</header>

<div class="boards-container">
    <div class="boards-main-header">
        <h1><i class="fa-regular fa-rectangle-list"></i> Мои проекты</h1>
        <button class="create-board-btn" onclick="showCreateBoardModal()">
            <i class="fa-solid fa-plus"></i> Создать проект
        </button>
    </div>

    <div id="boardsGrid" class="boards-grid">
        <div class="empty-boards">Загрузка...</div>
    </div>
</div>

<div id="createBoardModal" class="modal">
    <div class="modal-content" style="max-width: 440px;">
        <div class="modal-header">
            <h3><i class="fa-solid fa-plus"></i> Создать проект</h3>
            <button class="modal-close" onclick="closeBoardModal()">&times;</button>
        </div>
        <input type="text" id="boardTitle" placeholder="Название проекта" style="width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color); font-family: inherit;">
        <textarea id="boardDesc" placeholder="Описание (необязательно)" rows="3" style="width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color); margin-top: 14px; font-family: inherit; resize: none;"></textarea>
        <div class="modal-buttons">
            <button onclick="createBoard()" class="btn-save">Создать</button>
            <button onclick="closeBoardModal()" class="btn-cancel">Отмена</button>
        </div>
    </div>
</div>

<script>
    const API_BASE_URL = 'http://localhost:8081';

    async function loadBoards() {
        const token = localStorage.getItem('token');
        if (!token) { window.location.href = 'login.html'; return; }

        try {
            const response = await fetch(`${API_BASE_URL}/boards`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (response.ok) {
                const data = await response.json();
                const boards = data.data || data;
                displayBoards(boards);
            } else if (response.status === 401) {
                localStorage.removeItem('token');
                window.location.href = 'login.html';
            }
        } catch (error) {
            console.error('Error loading boards:', error);
            document.getElementById('boardsGrid').innerHTML = '<div class="empty-boards">⚠️ Ошибка загрузки</div>';
        }
    }

    function displayBoards(boards) {
        const container = document.getElementById('boardsGrid');
        if (!boards || boards.length === 0) {
            container.innerHTML = '<div class="empty-boards">📭 У вас пока нет проектов. Создайте первый!</div>';
            return;
        }
        container.innerHTML = boards.map(board => `
            <div class="board-card" onclick="openBoard(${board.id})">
                <div>
                    <h3><i class="fa-regular fa-rectangle-list"></i> ${escapeHtml(board.title)}</h3>
                    <p>${escapeHtml(board.description) || 'Нет описания'}</p>
                </div>
                <div class="board-card-footer">
                    <span><i class="fa-regular fa-calendar"></i> ${new Date().toLocaleDateString()}</span>
                    <button class="delete-board" onclick="event.stopPropagation(); deleteBoard(${board.id})" title="Удалить проект"><i class="fa-solid fa-trash"></i></button>
                </div>
            </div>
        `).join('');
    }

    function openBoard(boardId) {
        localStorage.setItem('currentBoardId', boardId);
        window.location.href = `board.html?id=${boardId}`;
    }

    async function createBoard() {
        const title = document.getElementById('boardTitle').value;
        const description = document.getElementById('boardDesc').value;
        const token = localStorage.getItem('token');
        if (!title) { alert('Введите название проекта'); return; }

        try {
            const response = await fetch(`${API_BASE_URL}/boards`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, description })
            });
            if (response.ok) {
                closeBoardModal();
                loadBoards();
                document.getElementById('boardTitle').value = '';
                document.getElementById('boardDesc').value = '';
            } else { alert('Ошибка создания'); }
        } catch (error) { alert('Ошибка подключения'); }
    }

    async function deleteBoard(boardId) {
        if (!confirm('Удалить проект? Все задачи будут потеряны!')) return;
        const token = localStorage.getItem('token');
        try {
            const response = await fetch(`${API_BASE_URL}/boards/${boardId}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (response.ok) { loadBoards(); } else { alert('Ошибка удаления'); }
        } catch (error) { alert('Ошибка подключения'); }
    }

    function showCreateBoardModal() { document.getElementById('createBoardModal').style.display = 'flex'; }
    function closeBoardModal() { document.getElementById('createBoardModal').style.display = 'none'; }
    function escapeHtml(text) { if (!text) return ''; const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }

    const themeToggle = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') { 
        document.body.classList.remove('dark'); 
        document.body.classList.add('light'); 
        if(themeToggle) themeToggle.innerHTML = '<i class="fa-solid fa-sun"></i> <span>Светлая тема</span>';
    } else { 
        document.body.classList.add('dark'); 
        document.body.classList.remove('light'); 
        if(themeToggle) themeToggle.innerHTML = '<i class="fa-solid fa-moon"></i> <span>Тёмная тема</span>';
    }
    
    themeToggle.addEventListener('click', () => {
        document.body.classList.toggle('dark');
        document.body.classList.toggle('light');
        const isDark = document.body.classList.contains('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        themeToggle.innerHTML = isDark ? '<i class="fa-solid fa-moon"></i> <span>Тёмная тема</span>' : '<i class="fa-solid fa-sun"></i> <span>Светлая тема</span>';
    });

    function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        window.location.href = 'login.html';
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadBoards();
        document.getElementById('createBoardModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('createBoardModal')) closeBoardModal();
        });
    });
</script>
</body>
</html>
