<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban Board</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="nav">
    <a href="index.html">📋 Board</a>
    <a href="users.html">👥 Users</a>
    <a href="profile.html">👤 Profile</a>
    <a href="archive.html">📦 Архив</a>
    <button id="themeToggle" class="theme-btn" style="margin-left: auto;">🌙 Тёмная тема</button>
  </div>

  <h1>📌 Kanban Board</h1>

  <div class="filters">
 <!-- Кнопка создания задачи -->
    <button onclick="openCreateModal()">➕ Создать задачу</button>


    <select id="priorityFilter">
      <option value="">All priorities</option>
      <option value="high">🔴 High</option>
      <option value="medium">🟡 Medium</option>
      <option value="low">🟢 Low</option>
    </select>

    <input id="userFilter" placeholder="👤 Assigned User ID" type="number" />
    <input type="text" id="searchInput" placeholder="🔍 Поиск по названию задачи" />

    <!-- <button onclick="loadTasks()">🔍 Apply Filter</button> -->
     <button onclick="applyFilter()">🔍 Apply Filter</button>
    <!-- <button onclick="clearFilters()">🗑️ Clear Filters</button> -->
     <button onclick="clearFilters()">🗑️ Clear Filters</button>
  </div>

  <!-- Панель меток -->
<div class="labels-panel">
    <h3>🏷️ Метки</h3>
    
    <!-- Список всех меток -->
    <div id="labelsList" class="labels-list"></div>
    
    <!-- Форма создания метки -->
    <div class="add-label-form">
        <input type="text" id="newLabelName" placeholder="Название метки" maxlength="60">
        <input type="color" id="newLabelColor" value="#3b82f6">
        <button onclick="createLabel()">➕ Добавить метку</button>
    </div>
    
    <!-- Фильтр по меткам -->
    <div class="filter-by-labels">
        <h4>Фильтр по меткам:</h4>
        <div id="labelFilters" class="label-filters"></div>
        <button onclick="clearLabelFilter()">✖️ Очистить фильтр меток</button>
        <!-- <button onclick="location.href='archive.html'">📦 Архив</button> -->
    </div>
</div>

<!-- Панель сортировки и пагинации -->
<div class="sort-pagination-panel">
    <div class="sort-section">
        <label>📊 Сортировать по:</label>
        <select id="sortBy">
            <option value="priority">Приоритету</option>
            <option value="created_at">Дате создания</option>
            <option value="title">Названию</option>
            <option value="assigned_to">Исполнителю</option>
        </select>
        
        <select id="sortOrder">
            <option value="asc">📈 По возрастанию</option>
            <option value="desc">📉 По убыванию</option>
        </select>
        
        <button onclick="applySortAndPage()">🔄 Применить</button>
    </div>
    
    <div class="pagination-section">
        <button onclick="prevPage()" id="prevBtn" disabled>◀ Назад</button>
        <span id="pageInfo">Страница 1 из 1</span>
        <button onclick="nextPage()" id="nextBtn" disabled>Вперед ▶</button>
        
        <div class="per-page">
            <label>Показывать:</label>
            <select id="perPage" onchange="changePerPage()">
                <option value="5">5</option>
                <option value="10" selected>10</option>
                <option value="20">20</option>
                <option value="50">50</option>
            </select>
            <span>задач</span>
        </div>
    </div>
</div>

  <div class="board-container" id="board"></div>

  <!-- Модальное окно -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <h3>✏️ Edit Task</h3>
      
      <input id="editTitle" placeholder="Task title" autocomplete="off" />
      <textarea id="editDesc" placeholder="Description" rows="3"></textarea>
      
      <select id="editPriority">
        <option value="low">🟢 Low</option>
        <option value="medium">🟡 Medium</option>
        <option value="high">🔴 High</option>
      </select>
      
      <input id="editAssignedTo" placeholder="Assigned User ID" type="number" />
      
      <div class="modal-labels-section">
    <h4>🏷️ Метки задачи:</h4>
    <div id="modalTaskLabels" class="modal-labels-list"></div>
</div>
      <div style="margin-top: 15px;">
        <button onclick="saveTask()">💾 Save</button>
        <button onclick="archiveCurrentTask()">📦 В архив</button>
        <button onclick="closeModal()">❌ Cancel</button>
         
      </div>
    </div>
  </div>


  <!-- Модальное окно для создания задачи -->
<div id="createModal" class="modal">
    <div class="modal-content">
        <h3>➕ Новая задача</h3>
        <input id="createTitle" placeholder="Название задачи" autocomplete="off" />
        <textarea id="createDesc" placeholder="Описание" rows="3"></textarea>
        <select id="createPriority">
            <option value="low">🟢 Low</option>
            <option value="medium" selected>🟡 Medium</option>
            <option value="high">🔴 High</option>
        </select>
        <input id="createAssignedTo" placeholder="ID исполнителя" type="number" />
        <select id="createColumnId">
            <option value="1">📋 To Do</option>
            <option value="2">⚙️ In Progress</option>
            <option value="3">✅ Done</option>
        </select>
        <div style="margin-top: 15px;">
            <button id="createTaskBtn" onclick="createTask()">💾 Создать</button>
            <button id="closeCreateModalBtn" onclick="closeCreateModal()">❌ Отмена</button>
            <!-- <button onclick="createTask()">💾 Создать</button>
            <button onclick="closeCreateModal()">❌ Отмена</button> -->
        </div>
    </div>
</div>


  <script src="config.js"></script>
  <script src="script.js"></script>
  <script src="labels.js"></script>
</body>
</html>
