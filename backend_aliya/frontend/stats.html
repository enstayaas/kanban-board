<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статистика - Kanban</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="nav">
    <a href="index.html"><i class="fa-regular fa-rectangle-list"></i> Доска</a>
    <a href="users.html"><i class="fa-solid fa-users"></i> Пользователи</a>
    <a href="profile.html"><i class="fa-regular fa-user"></i> Профиль</a>
    <a href="archive.html"><i class="fa-solid fa-box-archive"></i> Архив</a>
    <a href="stats.html"><i class="fa-solid fa-chart-simple"></i> Статистика</a>
    <button id="themeToggle" class="theme-btn" style="margin-left: auto;"><i class="fa-solid fa-moon"></i> Тёмная тема</button>
</div>

<div class="stats-wrapper">
    <!-- ЛЕВАЯ КОЛОНКА: СТАТИСТИКА В ЦИФРАХ -->
    <div class="stats-info">
        <div class="stats-card">
            <div class="stats-card-icon"><i class="fa-solid fa-check-circle"></i></div>
            <div class="stats-card-content">
                <div class="stats-card-value" id="doneCount">0</div>
                <div class="stats-card-label">✅ Выполнено</div>
            </div>
        </div>
        <div class="stats-card">
            <div class="stats-card-icon"><i class="fa-solid fa-spinner"></i></div>
            <div class="stats-card-content">
                <div class="stats-card-value" id="progressCount">0</div>
                <div class="stats-card-label">⚙️ В процессе</div>
            </div>
        </div>
        <div class="stats-card">
            <div class="stats-card-icon"><i class="fa-solid fa-clock"></i></div>
            <div class="stats-card-content">
                <div class="stats-card-value" id="todoCount">0</div>
                <div class="stats-card-label">📋 Не начато</div>
            </div>
        </div>
        <div class="stats-card total">
            <div class="stats-card-icon"><i class="fa-solid fa-chart-simple"></i></div>
            <div class="stats-card-content">
                <div class="stats-card-value" id="totalCount">0</div>
                <div class="stats-card-label">📊 Всего задач в доске</div>
            </div>
        </div>
    </div>

    <div class="donut-container">
    <div class="donut-chart" id="donutChart"></div>
    <div class="donut-center">
        <div class="percent" id="centerPercent">0%</div>
        <div class="label" id="centerLabel">выполнено</div>
    </div>
</div>
    <!-- ПРАВАЯ КОЛОНКА: КРУГОВАЯ ДИАГРАММА
    <div class="stats-chart">
        <div class="donut-container">
            <div class="donut-chart" id="donutChart"></div>
            <div class="donut-center">
    <div class="percent" id="centerPercent">0%</div>
    <div class="label" id="centerLabel">выполнено</div>
</div> -->
            <!-- <div class="donut-center">
                <div class="percent" id="centerPercent">0%</div>
                <div class="label">выполнено</div>
            </div> -->
        </div>
    </div>
</div>

<script src="config.js"></script>
<!-- <script src="auth.js"></script> -->
<script src="stats.js"></script>
</body>
</html>
