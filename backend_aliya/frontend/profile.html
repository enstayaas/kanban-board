<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой профиль - Kanban</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="nav">
    <a href="index.html"><i class="fa-regular fa-rectangle-list"></i> Доска</a>
    <a href="users.html"><i class="fa-solid fa-users"></i> Пользователи</a>
    <a href="profile.html"><i class="fa-regular fa-user"></i> Профиль</a>
    <a href="archive.html"><i class="fa-solid fa-box-archive"></i> Архив</a>
    <a href="stats.html"><i class="fa-solid fa-chart-simple"></i> Статистика</a>
    <button id="themeToggle" class="theme-btn" style="margin-left: auto;"><i class="fa-solid fa-moon"></i> Тёмная тема</button>
</div>

<div class="profile-container">
    <div class="profile-avatar-side">
        <div class="profile-avatar-large" id="avatarLetter">
            <span id="avatarInitials">👤</span>
        </div>
        <h2 id="profileNameTitle">Загрузка...</h2>
        <p id="profileEmailTitle">-</p>
        
        <div class="profile-bio">
            <h3><i class="fa-regular fa-address-card"></i> О себе</h3>
            <div id="bio-text" class="bio-text">Загрузка...</div>
            <button class="edit-bio-btn" onclick="editBio()"><i class="fa-regular fa-pen-to-square"></i> Редактировать</button>
        </div>
    </div>

    <div class="profile-card-glass">
        <div class="profile-tabs">
            <button class="tab-btn active" data-tab="info">📋 Информация</button>
            <button class="tab-btn" data-tab="edit">✏️ Редактировать</button>
        </div>

        <div id="info-tab" class="tab-content active">
            <div class="info-item">
                <div class="info-icon"><i class="fa-solid fa-id-card"></i></div>
                <div class="info-label">ID пользователя</div>
                <div class="info-value" id="profileId">-</div>
            </div>
            <div class="info-item">
                <div class="info-icon"><i class="fa-solid fa-user"></i></div>
                <div class="info-label">Имя</div>
                <div class="info-value" id="profileNameDisplay">-</div>
            </div>
            <div class="info-item">
                <div class="info-icon"><i class="fa-solid fa-envelope"></i></div>
                <div class="info-label">Электронная почта</div>
                <div class="info-value" id="profileEmailDisplay">-</div>
            </div>
        </div>

        <div id="edit-tab" class="tab-content">
            <div class="edit-form">
                <div class="form-group">
                    <label><i class="fa-regular fa-user"></i> Новое имя</label>
                    <input type="text" id="profileName" placeholder="Ваше имя">
                </div>
                <div class="form-group">
                    <label><i class="fa-regular fa-envelope"></i> Новый email</label>
                    <input type="email" id="profileEmail" placeholder="example@mail.com">
                </div>
                <button class="save-btn" onclick="saveProfile()">💾 Сохранить изменения</button>
                <div id="profileMessage" class="profile-message"></div>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно для редактирования "О себе" -->
<div id="bioModal" class="bio-modal">
    <div class="bio-modal-content">
        <div class="bio-modal-header">
            <h3><i class="fa-regular fa-address-card"></i> Расскажите о себе</h3>
            <button class="bio-modal-close" onclick="closeBioModal()">&times;</button>
        </div>
        <div class="bio-modal-body">
            <textarea id="bioInput" rows="4" placeholder="Напишите что-нибудь о себе..."></textarea>
        </div>
        <div class="bio-modal-footer">
            <button class="bio-save-btn" onclick="saveBioFromModal()">💾 Сохранить</button>
            <button class="bio-cancel-btn" onclick="closeBioModal()">Отмена</button>
        </div>
    </div>
</div>

<script src="config.js"></script>
<script src="profile.js"></script>
</body>
</html>
