<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки доски - Kanban</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="nav">
    <a href="index.html" id="nav-projects" class="back-btn"><i class="fa-solid fa-arrow-left"></i> К проектам</a>
    <a href="#" onclick="goToCurrentBoard(event)" id="nav-board"><i class="fa-regular fa-rectangle-list"></i> Доска</a>
    <a href="users.html" id="nav-users"><i class="fa-solid fa-users"></i> Пользователи</a>
    <a href="profile.html" id="nav-profile"><i class="fa-regular fa-user"></i> Профиль</a>
    <a href="archive.html" id="nav-archive"><i class="fa-solid fa-box-archive"></i> Архив</a>
    <a href="stats.html" id="nav-stats"><i class="fa-solid fa-chart-simple"></i> Статистика</a>
    <a href="activity.html" id="nav-activity"><i class="fa-solid fa-clock"></i> Активность</a>
    <a href="settings.html" id="nav-settings"><i class="fa-solid fa-gear"></i> Настройки</a>
    <button id="themeToggle" class="theme-btn" style="margin-left: auto;"><i class="fa-solid fa-moon"></i> Тёмная тема</button>
</div>

<h1><i class="fa-solid fa-gear"></i> Настройки доски</h1>

<div class="settings-container">
    <div class="settings-card">
        <h3><i class="fa-regular fa-rectangle-list"></i> Основная информация</h3>
        <div class="settings-field">
            <label>Название доски</label>
            <input type="text" id="boardTitleInput" placeholder="Название доски">
        </div>
        <div class="settings-field">
            <label>Описание</label>
            <textarea id="boardDescription" rows="3" placeholder="Описание доски"></textarea>
        </div>
        <button onclick="updateBoard()" class="save-btn">Сохранить изменения</button>
        <div id="settingsMessage" class="settings-message"></div>
    </div>

    <div class="settings-card danger">
        <h3><i class="fa-solid fa-triangle-exclamation"></i> Опасная зона</h3>
        <p>Перемещение доски в корзину скроет её с главного экрана. Вы сможете восстановить её из Архива в любой момент.</p>
        <button onclick="deleteBoard()" class="danger-btn">🗑️ Переместить в корзину</button>
    </div>
</div>

<script>
    const API_BASE_URL = 'http://localhost:8081';
    
    // --- Логика умной навигации ---
    const currentBoardId = new URLSearchParams(window.location.search).get('id') || localStorage.getItem('currentBoardId') || 1;

    if (new URLSearchParams(window.location.search).get('id')) {
        localStorage.setItem('currentBoardId', new URLSearchParams(window.location.search).get('id'));
    }

    function goToCurrentBoard(event) {
        if (event) event.preventDefault();
        window.location.href = `board.html?id=${currentBoardId}`;
    }

    function highlightActiveNav() {
        const currentPage = window.location.pathname.split("/").pop();
        document.querySelectorAll('.nav a').forEach(a => a.classList.remove('active'));
        
        if (currentPage === 'board.html' || currentPage === '') {
            document.getElementById('nav-board')?.classList.add('active');
        } else if (currentPage === 'activity.html') {
            document.getElementById('nav-activity')?.classList.add('active');
        } else if (currentPage === 'users.html') {
            document.getElementById('nav-users')?.classList.add('active');
        } else if (currentPage === 'profile.html') {
            document.getElementById('nav-profile')?.classList.add('active');
        } else if (currentPage === 'archive.html') {
            document.getElementById('nav-archive')?.classList.add('active');
        } else if (currentPage === 'stats.html') {
            document.getElementById('nav-stats')?.classList.add('active');
        } else if (currentPage === 'settings.html') {
            document.getElementById('nav-settings')?.classList.add('active');
        }
    }
    // ---------------------------------

    async function fetchAPI(url, options = {}) {
        const token = localStorage.getItem('token');
        const headers = { 'Content-Type': 'application/json', ...options.headers };
        if (token) headers['Authorization'] = `Bearer ${token}`;
        const response = await fetch(url, { ...options, headers });
        if (response.status === 401) { localStorage.removeItem('token'); window.location.href = 'login.html'; }
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
    }

    async function loadBoardSettings() {
        try {
            const board = await fetchAPI(`${API_BASE_URL}/boards/${currentBoardId}`);
            document.getElementById('boardTitleInput').value = board.title || '';
            document.getElementById('boardDescription').value = board.description || '';
        } catch (error) {
            console.error('Ошибка загрузки:', error);
        }
    }

    async function updateBoard() {
        const title = document.getElementById('boardTitleInput').value.trim();
        const description = document.getElementById('boardDescription').value;
        const msg = document.getElementById('settingsMessage');
        
        if (!title) {
            msg.innerText = '❌ Название доски не может быть пустым';
            msg.style.color = 'red';
            return;
        }
        
        try {
            await fetchAPI(`${API_BASE_URL}/boards/${currentBoardId}`, {
                method: 'PUT',
                body: JSON.stringify({ title, description })
            });
            msg.innerText = '✅ Настройки сохранены!';
            msg.style.color = 'green';
            setTimeout(() => msg.innerText = '', 3000);
            
            const boardTitle = document.getElementById('boardTitle');
            if (boardTitle) boardTitle.innerHTML = title;
        } catch (error) {
            msg.innerText = `❌ Ошибка: ${error.message}`;
            msg.style.color = 'red';
        }
    }

    // ИЗМЕНЕННАЯ ФУНКЦИЯ: Теперь отправляет в архив (корзину) вместо полного удаления
    async function deleteBoard() {
        const title = document.getElementById('boardTitleInput').value.trim();
        const description = document.getElementById('boardDescription').value;

        if (!confirm('⚠️ Вы уверены, что хотите переместить эту доску в корзину? Её можно будет восстановить из вкладки "Архив".')) return;
        
        try {
            // Отправляем PUT-запрос с флагом архивации
            await fetchAPI(`${API_BASE_URL}/boards/${currentBoardId}`, { 
                method: 'PUT',
                body: JSON.stringify({ 
                    title: title, 
                    description: description,
                    is_archived: true 
                })
            });
            
            localStorage.removeItem('currentBoardId');
            alert('🗑️ Доска перемещена в корзину');
            window.location.href = 'index.html'; // Возвращаемся к списку проектов
        } catch (error) {
            alert('Ошибка удаления: ' + error.message);
        }
    }

    // Тёмная тема
    const theme = localStorage.getItem('theme');
    if (theme === 'light') { document.body.classList.remove('dark'); document.body.classList.add('light'); }
    else { document.body.classList.add('dark'); document.body.classList.remove('light'); }
    document.getElementById('themeToggle')?.addEventListener('click', () => {
        document.body.classList.toggle('dark');
        document.body.classList.toggle('light');
        localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
    });

    // Инициализация при загрузке страницы
    document.addEventListener('DOMContentLoaded', () => {
        loadBoardSettings();
        highlightActiveNav(); // Подсвечиваем вкладку "Настройки"
    });
</script>

<style>
    .settings-container { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }
    .settings-card { background: rgba(255,255,255,0.1); backdrop-filter: blur(8px); border-radius: 24px; padding: 24px; border: 1px solid rgba(255,255,255,0.1); }
    .settings-card h3 { margin-bottom: 20px; font-size: 18px; }
    .settings-field { margin-bottom: 20px; }
    .settings-field label { display: block; margin-bottom: 8px; font-weight: 500; }
    .settings-field input, .settings-field textarea { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: inherit; font-family: inherit; }
    .save-btn { background: linear-gradient(135deg, #8b5cf6, #a78bfa); color: white; border: none; padding: 10px 20px; border-radius: 40px; cursor: pointer; font-weight: 600; transition: all 0.2s; }
    .save-btn:hover { transform: scale(1.02); }
    .danger { border-color: #ef4444; }
    .danger-btn { background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 40px; cursor: pointer; font-weight: 600; transition: all 0.2s; }
    .danger-btn:hover { transform: scale(1.02); background: #dc2626; }
    .settings-message { margin-top: 16px; text-align: center; font-size: 14px; }
    body.light .settings-card { background: rgba(255,255,255,0.7); }
    body.dark .settings-card { background: rgba(30,27,75,0.5); }
</style>
</body>
</html>
