<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Журнал активности - Kanban</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="nav">
    <a href="index.html" id="nav-projects" class="back-btn"><i class="fa-solid fa-arrow-left"></i> К проектам</a>
    <a href="#" onclick="goToCurrentBoard(event)" id="nav-board"><i class="fa-regular fa-rectangle-list"></i> Доска</a>
    <a href="users.html"><i class="fa-solid fa-users"></i> Пользователи</a>
    <a href="profile.html"><i class="fa-regular fa-user"></i> Профиль</a>
    <a href="archive.html"><i class="fa-solid fa-box-archive"></i> Архив</a>
    <a href="stats.html"><i class="fa-solid fa-chart-simple"></i> Статистика</a>
    <a href="settings.html"><i class="fa-solid fa-gear"></i> Настройки</a>
    <a href="activity.html"><i class="fa-solid fa-clock"></i> Активность</a>
    <button id="themeToggle" class="theme-btn" style="margin-left: auto;"><i class="fa-solid fa-moon"></i> Тёмная тема</button>
</div>

<h1><i class="fa-solid fa-clock"></i> Журнал активности</h1>

<div class="activity-filters">
    <select id="filterAction">
        <option value="">Все действия</option>
        <option value="create_task">➕ Создание задачи</option>
        <option value="move_task">🔄 Перемещение задачи</option>
        <option value="edit_task">✏️ Редактирование</option>
        <option value="archive_task">📦 Архивация</option>
        <option value="restore_task">↺ Восстановление</option>
        <option value="add_label">🏷️ Добавление метки</option>
        <option value="create_board">📋 Создание доски</option>
        <option value="delete_board">🗑️ Удаление доски</option>
        <option value="add_member">👥 Добавление участника</option>
        <option value="update_settings">⚙️ Настройки доски</option>
    </select>
    <input type="text" id="searchActivity" placeholder="🔍 Поиск по описанию">
    <button onclick="loadActivity()" class="btn-apply"><i class="fa-solid fa-magnifying-glass"></i> Применить</button>
    <button onclick="resetFilters()" style="background: #6b7280; color: white; border: none; padding: 8px 16px; border-radius: 40px; cursor: pointer;"><i class="fa-solid fa-filter-circle-xmark"></i> Сбросить фильтры</button>
    <button onclick="clearActivityLog()" class="btn-clear"><i class="fa-solid fa-trash-can"></i> Удалить историю</button>
</div>

<div id="activityContainer" class="activity-container">
    <div class="loader">Загрузка...</div>
</div>

<script>
    let currentPage = 1;
    let perPage = 20;

    // Генерируем фейковые, но реалистичные логи, чтобы страница не была пустой
    function getMockActivities() {
        let localData = localStorage.getItem('mock_activities');
        if (localData) return JSON.parse(localData);

        const mock = [
            { id: 1, action: 'move_task', description: 'Переместил задачу "Написать тесты бэкенда" в колонку "Done"', user_name: 'Анна Смирнова', created_at: new Date(Date.now() - 1000 * 60 * 15).toISOString() },
            { id: 2, action: 'create_task', description: 'Создал новую задачу "Рефакторинг авторизации"', user_name: 'Максим Иванов', created_at: new Date(Date.now() - 1000 * 60 * 60 * 2).toISOString() },
            { id: 3, action: 'add_label', description: 'Добавил метку "Bug" к задаче "Исправить баг драг-н-дропа"', user_name: 'Виктор Сидоров', created_at: new Date(Date.now() - 1000 * 60 * 60 * 5).toISOString() },
            { id: 4, action: 'edit_task', description: 'Изменил описание задачи "gg"', user_name: 'Текущий Пользователь', created_at: new Date(Date.now() - 1000 * 60 * 60 * 24).toISOString() },
            { id: 5, action: 'add_member', description: 'Пригласил пользователя борис@example.com на доску', user_name: 'Анна Смирнова', created_at: new Date(Date.now() - 1000 * 60 * 60 * 48).toISOString() },
            { id: 6, action: 'archive_task', description: 'Отправил задачу "Старый ТЗ" в архив', user_name: 'Елена Морозова', created_at: new Date(Date.now() - 1000 * 60 * 60 * 72).toISOString() }
        ];

        localStorage.setItem('mock_activities', JSON.stringify(mock));
        return mock;
    }

    async function loadActivity() {
        const container = document.getElementById('activityContainer');
        if (!container) return;
        container.innerHTML = '<div class="loader">Загрузка...</div>';
        
        const actionFilter = document.getElementById('filterAction').value;
        const searchFilter = document.getElementById('searchActivity').value.toLowerCase();
        
        setTimeout(() => {
            let activities = getMockActivities();

            if (actionFilter) {
                activities = activities.filter(a => a.action === actionFilter);
            }

            if (searchFilter) {
                activities = activities.filter(a => a.description.toLowerCase().includes(searchFilter) || a.user_name.toLowerCase().includes(searchFilter));
            }

            const totalItems = activities.length;
            const totalPages = Math.ceil(totalItems / perPage) || 1;
            const startIdx = (currentPage - 1) * perPage;
            const paginatedData = activities.slice(startIdx, startIdx + perPage);

            renderActivity({
                data: paginatedData,
                meta: { page: currentPage, totalPages: totalPages }
            });
        }, 200);
    }

    function renderActivity(data) {
        const container = document.getElementById('activityContainer');
        if (!container) return;
        const activities = data.data || [];
        const meta = data.meta || { page: 1, totalPages: 1 };
        
        if (activities.length === 0) {
            container.innerHTML = '<div class="empty-state">📭 Нет активности</div>';
            return;
        }
        
        container.innerHTML = `
            <div class="activity-list">
                ${activities.map(activity => `
                    <div class="activity-item">
                        <div class="activity-icon">${getIcon(activity.action)}</div>
                        <div class="activity-content">
                            <div class="activity-text">${escapeHtml(activity.description)}</div>
                            <div class="activity-meta">
                                <span><i class="fa-regular fa-user"></i> ${escapeHtml(activity.user_name || 'Пользователь')}</span>
                                <span><i class="fa-regular fa-calendar"></i> ${formatDate(activity.created_at)}</span>
                            </div>
                        </div>
                    </div>
                `).join('')}
            </div>
            <div class="pagination">
                <button onclick="prevPage()" ${meta.page <= 1 ? 'disabled' : ''}><i class="fa-solid fa-chevron-left"></i> Назад</button>
                <span>Страница ${meta.page} из ${meta.totalPages || 1}</span>
                <button onclick="nextPage()" ${meta.page >= meta.totalPages ? 'disabled' : ''}>Вперед <i class="fa-solid fa-chevron-right"></i></button>
            </div>
        `;
    }

    function getIcon(action) {
        const icons = {
            create_task: '➕', move_task: '🔄', edit_task: '✏️',
            archive_task: '📦', restore_task: '↺', add_label: '🏷️',
            create_board: '📋', delete_board: '🗑️', add_member: '👥',
            update_settings: '⚙️'
        };
        return icons[action] || '📌';
    }

    function formatDate(dateStr) {
        if (!dateStr) return '';
        const date = new Date(dateStr);
        return date.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function prevPage() { if (currentPage > 1) { currentPage--; loadActivity(); } }
    function nextPage() { currentPage++; loadActivity(); }
    
    // Сброс фильтров поиска
    function resetFilters() {
        document.getElementById('filterAction').value = '';
        document.getElementById('searchActivity').value = '';
        currentPage = 1;
        loadActivity();
    }

    // Полное удаление истории
    function clearActivityLog() {
        if (confirm('Вы уверены, что хотите полностью удалить весь журнал активности? Это действие нельзя отменить.')) {
            localStorage.setItem('mock_activities', JSON.stringify([]));
            document.getElementById('filterAction').value = '';
            document.getElementById('searchActivity').value = '';
            currentPage = 1;
            loadActivity();
        }
    }

    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m] || m)); }

    // Тёмная тема
    const theme = localStorage.getItem('theme');
    if (theme === 'light') { document.body.classList.remove('dark'); document.body.classList.add('light'); }
    else { document.body.classList.add('dark'); document.body.classList.remove('light'); }
    document.getElementById('themeToggle')?.addEventListener('click', () => {
        document.body.classList.toggle('dark');
        document.body.classList.toggle('light');
        localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
    });

    document.addEventListener('DOMContentLoaded', loadActivity);
    // --- НАЧАЛО БЛОКА НАВИГАЦИИ ---

// 1. Сразу считываем ID доски, на которой пользователь работал, чтобы не потерять его
const currentBoardId = new URLSearchParams(window.location.search).get('id') || localStorage.getItem('currentBoardId') || 1;

// Если мы зашли на страницу, где в URL есть ?id=..., принудительно обновляем память
const urlParamsCheck = new URLSearchParams(window.location.search);
if (urlParamsCheck.get('id')) {
    localStorage.setItem('currentBoardId', urlParamsCheck.get('id'));
}

// 2. Функция умного возврата на сохраненную доску
function goToCurrentBoard(event) {
    if (event) event.preventDefault();
    window.location.href = `board.html?id=${currentBoardId}`;
}

// 3. Функция подсветки вкладки, на которой мы сейчас находимся
function highlightActiveNav() {
    const currentPage = window.location.pathname.split("/").pop();
    document.querySelectorAll('.nav a').forEach(a => a.classList.remove('active'));
    
    if (currentPage === 'board.html' || currentPage === '') {
        document.getElementById('nav-board')?.classList.add('active');
    } else if (currentPage === 'activity.html') {
        document.getElementById('nav-activity')?.classList.add('active');
    } else if (currentPage === 'users.html') {
        document.getElementById('nav-users')?.classList.add('active');
    } else if (currentPage === 'profile.html') {
        document.getElementById('nav-profile')?.classList.add('active');
    } else if (currentPage === 'archive.html') {
        document.getElementById('nav-archive')?.classList.add('active');
    } else if (currentPage === 'stats.html') {
        document.getElementById('nav-stats')?.classList.add('active');
    } else if (currentPage === 'settings.html') {
        document.getElementById('nav-settings')?.classList.add('active');
    }
}

// Запускаем подсветку сразу после загрузки страницы
document.addEventListener('DOMContentLoaded', () => {
    highlightActiveNav();
});

// --- КОНЕЦ БЛОКА НАВИГАЦИИ ---
</script>

<style>
    .activity-filters {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 24px;
        background: rgba(255,255,255,0.05);
        padding: 16px;
        border-radius: 20px;
        backdrop-filter: blur(4px);
    }
    .activity-filters select, .activity-filters input {
        padding: 8px 12px;
        border-radius: 40px;
        border: 1px solid rgba(255,255,255,0.2);
        background: rgba(0,0,0,0.2);
        color: inherit;
    }
    .activity-filters button {
        padding: 8px 16px;
        border-radius: 40px;
        cursor: pointer;
        border: none;
    }
    .btn-apply { background: #8b5cf6; color: white; }
    .btn-clear { background: #ef4444; color: white; }
    .activity-container { background: transparent; }
    .activity-list { display: flex; flex-direction: column; gap: 12px; }
    .activity-item {
        display: flex;
        gap: 16px;
        padding: 16px;
        background: rgba(255,255,255,0.05);
        border-radius: 20px;
        backdrop-filter: blur(8px);
        transition: all 0.2s;
        color: #fff;
    }
    body.light .activity-item { color: #333; }
    .activity-item:hover { transform: translateX(4px); background: rgba(255,255,255,0.1); }
    .activity-icon { font-size: 28px; min-width: 48px; text-align: center; }
    .activity-content { flex: 1; }
    .activity-text { margin-bottom: 8px; font-size: 14px; }
    .activity-meta { display: flex; gap: 16px; font-size: 12px; opacity: 0.7; }
    .pagination {
        display: flex;
        justify-content: center;
        gap: 16px;
        margin-top: 24px;
        align-items: center;
    }
    .pagination button {
        padding: 8px 16px;
        border-radius: 40px;
        cursor: pointer;
        background: rgba(255,255,255,0.1);
        border: none;
        color: inherit;
    }
    .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
    body.light .activity-item { background: rgba(0,0,0,0.03); }
    body.light .activity-filters { background: rgba(0,0,0,0.02); }
</style>
</body>
</html>
