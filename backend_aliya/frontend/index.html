<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои проекты - Kanban</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .boards-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .boards-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .boards-header h1 {
            font-size: 28px;
            font-weight: 600;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .create-board-btn {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .create-board-btn:hover {
            background: #4338ca;
            transform: translateY(-1px);
        }

        .boards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .board-card {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .board-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .board-card h3 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 8px;
        }

        .board-card p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .board-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .delete-board {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 14px;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .delete-board:hover {
            background: rgba(239,68,68,0.1);
        }

        .empty-boards {
            text-align: center;
            padding: 60px;
            color: var(--text-secondary);
        }

        .nav {
            display: flex;
            gap: 20px;
            padding: 16px 24px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            align-items: center;
        }

        .nav a {
            color: var(--text-color);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .nav a:hover, .nav a.active {
            background: var(--hover-bg);
            color: #4f46e5;
        }
    </style>
</head>
<body>

<div class="nav">
    <a href="index.html" class="active"><i class="fa-regular fa-rectangle-list"></i> Мои проекты</a>
    <a href="profile.html"><i class="fa-regular fa-user"></i> Профиль</a>
    <a href="settings.html"><i class="fa-solid fa-gear"></i> Настройки</a>
    <button id="themeToggle" class="theme-btn" style="margin-left: auto;"><i class="fa-solid fa-moon"></i> Тёмная тема</button>
</div>

<div class="boards-container">
    <div class="boards-header">
        <h1><i class="fa-regular fa-rectangle-list"></i> Мои проекты</h1>
        <button class="create-board-btn" onclick="showCreateBoardModal()"><i class="fa-solid fa-plus"></i> Создать проект</button>
    </div>

    <div id="boardsGrid" class="boards-grid">
        <div class="empty-boards">Загрузка...</div>
    </div>
</div>

<!-- Модальное окно создания доски -->
<div id="createBoardModal" class="modal">
    <div class="modal-content" style="max-width: 400px;">
        <div class="modal-header">
            <h3><i class="fa-solid fa-plus"></i> Создать проект</h3>
            <button class="modal-close" onclick="closeBoardModal()">&times;</button>
        </div>
        <input type="text" id="boardTitle" placeholder="Название проекта" style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color);">
        <textarea id="boardDesc" placeholder="Описание (необязательно)" rows="3" style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color); margin-top: 12px;"></textarea>
        <div class="modal-buttons" style="margin-top: 20px;">
            <button onclick="createBoard()" class="btn-save">Создать</button>
            <button onclick="closeBoardModal()" class="btn-cancel">Отмена</button>
        </div>
    </div>
</div>

<script>
    const API_BASE_URL = 'http://localhost:8081';

    // Загрузка досок
    async function loadBoards() {
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'login.html';
            return;
        }

        try {
            const response = await fetch(`${API_BASE_URL}/boards`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (response.ok) {
                const data = await response.json();
                const boards = data.data || data;
                displayBoards(boards);
            } else if (response.status === 401) {
                localStorage.removeItem('token');
                window.location.href = 'login.html';
            }
        } catch (error) {
            console.error('Error loading boards:', error);
            document.getElementById('boardsGrid').innerHTML = '<div class="empty-boards">⚠️ Ошибка загрузки</div>';
        }
    }

    // Отображение досок
    function displayBoards(boards) {
        const container = document.getElementById('boardsGrid');
        
        if (!boards || boards.length === 0) {
            container.innerHTML = '<div class="empty-boards">📭 У вас пока нет проектов. Создайте первый!</div>';
            return;
        }

        container.innerHTML = boards.map(board => `
            <div class="board-card" onclick="openBoard(${board.id})">
                <h3><i class="fa-regular fa-rectangle-list"></i> ${escapeHtml(board.title)}</h3>
                <p>${escapeHtml(board.description) || 'Нет описания'}</p>
                <div class="board-card-footer">
                    <span><i class="fa-regular fa-calendar"></i> ${new Date().toLocaleDateString()}</span>
                    <button class="delete-board" onclick="event.stopPropagation(); deleteBoard(${board.id})"><i class="fa-solid fa-trash"></i></button>
                </div>
            </div>
        `).join('');
    }

    // Открытие доски
    
      function openBoard(boardId) {
    localStorage.setItem('currentBoardId', boardId);
    window.location.href = `board.html?id=${boardId}`;
}
    

    // Создание доски
    async function createBoard() {
        const title = document.getElementById('boardTitle').value;
        const description = document.getElementById('boardDesc').value;
        const token = localStorage.getItem('token');

        if (!title) {
            alert('Введите название проекта');
            return;
        }

        try {
            const response = await fetch(`${API_BASE_URL}/boards`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ title, description })
            });

            if (response.ok) {
                closeBoardModal();
                loadBoards();
                document.getElementById('boardTitle').value = '';
                document.getElementById('boardDesc').value = '';
            } else {
                alert('Ошибка создания');
            }
        } catch (error) {
            console.error('Error creating board:', error);
            alert('Ошибка подключения');
        }
    }

    // Удаление доски
    async function deleteBoard(boardId) {
        if (!confirm('Удалить проект? Все задачи будут потеряны!')) return;
        
        const token = localStorage.getItem('token');

        try {
            const response = await fetch(`${API_BASE_URL}/boards/${boardId}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (response.ok) {
                loadBoards();
            } else {
                alert('Ошибка удаления');
            }
        } catch (error) {
            console.error('Error deleting board:', error);
            alert('Ошибка подключения');
        }
    }

    // Модальное окно
    function showCreateBoardModal() {
        document.getElementById('createBoardModal').style.display = 'flex';
    }

    function closeBoardModal() {
        document.getElementById('createBoardModal').style.display = 'none';
    }

    // Экранирование HTML
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // Тёмная тема
    const themeToggle = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') {
        document.body.classList.remove('dark');
        document.body.classList.add('light');
    } else {
        document.body.classList.add('dark');
        document.body.classList.remove('light');
    }
    
    themeToggle.addEventListener('click', () => {
        document.body.classList.toggle('dark');
        document.body.classList.toggle('light');
        localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
    });

    // Инициализация
    document.addEventListener('DOMContentLoaded', () => {
        loadBoards();
        
        // Закрытие модального окна по клику вне его
        document.getElementById('createBoardModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('createBoardModal')) {
                closeBoardModal();
            }
        });
    });
</script>
</body>
</html>
