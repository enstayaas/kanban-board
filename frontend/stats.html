<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статистика - Kanban</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* ===== СТИЛИ ДЛЯ СТРАНИЦЫ СТАТИСТИКИ ===== */
        .stats-page {
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
        }

        .stats-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .stats-header h1 {
            font-size: 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }

        .stats-header p {
            color: #718096;
            font-size: 16px;
        }

        /* ===== КРУГОВАЯ ДИАГРАММА ===== */
        .donut-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
        }

        .donut-container {
            position: relative;
            width: 280px;
            height: 280px;
        }

        .donut-chart {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: all 0.5s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .donut-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: white;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .donut-center .percent {
            font-size: 32px;
            font-weight: 700;
            color: #2d3748;
        }

        .donut-center .label {
            font-size: 12px;
            color: #718096;
            margin-top: 5px;
        }

        /* ===== ЛЕГЕНДА ===== */
        .stats-legend {
            background: #f7fafc;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .legend-item:last-child {
            border-bottom: none;
        }

        .legend-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }

        .legend-label {
            font-weight: 500;
            color: #2d3748;
        }

        .legend-value {
            font-weight: 600;
            color: #4a5568;
        }

        .legend-percent {
            color: #718096;
            font-size: 13px;
            margin-left: 8px;
        }

        /* ===== КАРТОЧКА С ОБЩЕЙ СТАТИСТИКОЙ ===== */
        .total-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            color: white;
        }

        .total-card .total-number {
            font-size: 36px;
            font-weight: 700;
        }

        .total-card .total-label {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 5px;
        }

        /* ===== АНИМАЦИЯ ===== */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stats-page {
            animation: fadeInUp 0.5s ease;
        }
    </style>
</head>
<body>
    <div class="nav">
          <a href="index.html"><i class="fa-regular fa-rectangle-list"></i> Board</a>
    <a href="users.html"><i class="fa-solid fa-users"></i> Users</a>
    <a href="profile.html"><i class="fa-regular fa-user"></i> Profile</a>
    <a href="archive.html"><i class="fa-solid fa-box-archive"></i> Архив</a>
    <a href="stats.html"><i class="fa-solid fa-chart-simple"></i> Статистика</a>
    <button id="themeToggle" class="theme-btn" style="margin-left: auto;"><i class="fa-solid fa-moon"></i> Тёмная тема</button>
</div>
        <!-- <a href="index.html">📋 Board</a>
        <a href="users.html">👥 Users</a>
        <a href="profile.html">👤 Profile</a>
        <a href="archive.html">📦 Архив</a>
        <a href="stats.html">📊 Статистика</a>
    </div> -->

    <div class="stats-page">
        <div class="stats-header">
            <h1>📊 Статистика задач</h1>
            <p>Анализ выполнения задач в вашей канбан-доске</p>
        </div>

        <div class="donut-wrapper">
            <div class="donut-container">
                <div class="donut-chart" id="donutChart"></div>
                <div class="donut-center">
                    <div class="percent" id="centerPercent">0%</div>
                    <div class="label">выполнено</div>
                </div>
            </div>
        </div>

        <div class="stats-legend" id="legend"></div>

        <div class="total-card" id="totalCard">
            <div class="total-number" id="totalNumber">0</div>
            <div class="total-label">📋 Всего задач в доске</div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="stats.js"></script>
</body>
</html>
